<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!--
    Mirrors the backend's own helmet CSP (see backend/src/app.js) for the
    same reason that one exists: without it, this page - which renders the
    TapPay payment iframes - shipped with no script-allowlist or clickjacking
    protection at all. connect-src/style-src/img-src are deliberately left
    unset (not restricted) rather than guessed at, since this frontend talks
    to a backend API origin that varies by deployment and Flutter Web's
    runtime relies on inline styles - restricting either here without
    knowing the real deployment would break the app rather than secure it.
  -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'wasm-unsafe-eval' https://js.tappaysdk.com https://sandbox.tappaysdk.com https://prod.tappaysdk.com; frame-src 'self' https://js.tappaysdk.com https://sandbox.tappaysdk.com https://prod.tappaysdk.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'">


  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="restaurant_order_system_frontend">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>restaurant_order_system_frontend</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
